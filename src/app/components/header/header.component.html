<header class="site-header" [class.is-scrolled]="scrolled()">
  <div class="container bar">
    <a href="#topo" class="brand" (click)="closeMenu()">
      <img src="assets/logo-transparent.webp" alt="Central dos Celulares" class="brand-logo" />
    </a>

    <nav class="nav" [class.open]="menuOpen()">
      <a href="#catalogo" (click)="closeMenu()">Catálogo</a>
      <a href="#destaque" (click)="closeMenu()">Destaque</a>
      <a href="#contato" (click)="closeMenu()">Contato</a>
      <a href="#loja" (click)="closeMenu()">Loja física</a>
      <a class="btn btn-primary nav-cta" href="#contato" (click)="closeMenu()">Falar no WhatsApp</a>
    </nav>

    <button class="menu-btn" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Abrir menu">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>
